name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r app/requirements-dev.txt

      - name: Run tests
        run: pytest -q

  docker-build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t docker-optimize-lab:ci .

      # Ghi chú: chưa có layer caching (buildx cache), chưa scan lỗ hổng
      # (vd: trivy/grype), chưa push lên registry, chưa build multi-arch.
      # Đây là những điểm để Claude Code đề xuất cải thiện trong lab.
