services:
  api:
    build: .
    restart: unless-stopped
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Thiếu ADMIN_PASSWORD, hãy tạo file .env (xem .env.example)}
    volumes:
      - chia-data:/data

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./chia-doi-bong.html:/usr/share/nginx/html/index.html:ro

volumes:
  chia-data:
