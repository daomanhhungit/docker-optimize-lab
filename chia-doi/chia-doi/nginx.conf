server {
    listen 80;
    charset utf-8;

    root /usr/share/nginx/html;
    index index.html;

    # Luôn lấy bản trang mới nhất
    add_header Cache-Control "no-cache";

    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri /index.html;
    }
}
